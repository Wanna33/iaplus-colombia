<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel admin | IA Plus Colombia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IA Plus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e6bff">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e6ebf4;--text:#101a33;--mut:#5f6f8c;--acc:#1e6bff;--acc2:#12a8ff;--ok:#12a36b;--okbg:#e3f7ee;--warn:#c27a00;--warnbg:#fff4dc;--bad:#d33;--badbg:#fde8e8;--soft:#eef4ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:inherit;text-decoration:none}
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar-in{max-width:1300px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar img{height:52px;width:auto}
.bar h1{font-size:19px}
.sp{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.p{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:0}
.btn.p:hover{color:#fff;filter:brightness(1.05)}
.btn.s{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.d{color:var(--bad)}.btn.d:hover{border-color:var(--bad);color:var(--bad)}
.btn.wa{color:#0b8f4d}.btn.wa:hover{border-color:#0b8f4d;color:#0b8f4d}
main{max-width:1300px;margin:0 auto;padding:22px 20px 70px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;position:sticky;top:64px;z-index:15}
.tabs button{flex:1 1 auto;border:0;background:none;padding:10px 14px;border-radius:10px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button i{font-style:normal}
.fab{display:none}
.tabs button.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{color:var(--mut);font-size:13px}
.stat.big{grid-column:1/-1;background:linear-gradient(135deg,#12a8ff,#1e56ff);color:#fff;border:0;padding:20px 24px}
.stat.big span{color:#dbe9ff;font-size:15px;font-weight:600}
.stat.big b{font-size:clamp(46px,9vw,72px);margin:4px 0}
.stat.big small{color:#dbe9ff;font-size:13px}
.accrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.accrow:last-child{border-bottom:0}
.accname{font-weight:700;flex:1 1 240px;word-break:break-all}
.stat.w b{color:var(--warn)}.stat.b b{color:var(--bad)}.stat.g b{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 8px 24px rgba(30,60,120,.05)}
.card h2{font-size:18px;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form label{font-size:13px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(30,107,255,.3);border-color:var(--acc)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input{max-width:300px}.tools select{max-width:200px}
.wrapt{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
th{text-align:left;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fafcff}
.mono{font-family:Consolas,monospace;font-weight:700;letter-spacing:.03em}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.t-ok{background:var(--okbg);color:var(--ok)}.t-av{background:var(--soft);color:var(--acc)}.t-w{background:var(--warnbg);color:var(--warn)}.t-b{background:var(--badbg);color:var(--bad)}.t-g,.t-nc{background:#eef1f7;color:var(--mut)}.t-pr{background:#2b1a05;color:#ffb347}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.msg{max-width:480px;margin:90px auto;text-align:center}
.msg h2{font-size:26px;margin-bottom:8px}.msg p{color:var(--mut);margin-bottom:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#101a33;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;z-index:50;max-width:92vw}
.toast.on{transform:translateX(-50%);opacity:1}
.newcode{margin-top:12px;background:var(--okbg);border:1px solid #b6e8d1;border-radius:14px;padding:14px;display:none}
.newcode.on{display:block}
.newcode .mono{font-size:26px;color:var(--ok)}
.codeline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.codeline .mono{font-size:20px}
.empty{text-align:center;color:var(--mut);padding:30px}
.hide{display:none!important}
tr.hl td{background:#fff7cf!important}
.saved{margin-top:10px;font-size:13px;color:var(--ok);font-weight:600}
.note{font-size:12px;color:var(--mut);max-width:220px;white-space:pre-wrap;word-break:break-word}
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:90px 1fr 150px;gap:10px;align-items:center;font-size:13px}
.brow i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--acc2),var(--acc));min-width:2px}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .who{flex:1 1 220px;word-break:break-all}
dialog{border:0;border-radius:18px;padding:22px;width:min(560px,92vw);box-shadow:0 20px 60px rgba(10,20,50,.35);color:var(--text)}
dialog::backdrop{background:rgba(10,20,50,.45)}
dialog h2{font-size:19px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin-bottom:14px}
.kv b{color:var(--mut);font-weight:600}
.kv span{word-break:break-all}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(180deg,#fff,var(--soft));transition:transform .25s,box-shadow .25s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(30,100,255,.15)}
.pcard .pe{font-size:28px}.pcard .pn{font-size:30px;font-weight:800;line-height:1.1;margin:6px 0}.pcard .pn small{font-size:13px;color:var(--mut);font-weight:600}.pcard .pm{font-size:13px;color:var(--mut)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
section[id^=tab-]:not(.hide)>.card,section[id^=tab-]:not(.hide)>details{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
section[id^=tab-]:not(.hide)>.card:nth-child(2){animation-delay:.06s}
section[id^=tab-]:not(.hide)>.card:nth-child(3){animation-delay:.12s}
section[id^=tab-]:not(.hide)>.card:nth-child(4){animation-delay:.18s}
.stat{transition:transform .25s,box-shadow .25s;animation:up .5s cubic-bezier(.2,.7,.2,1) both}.stat:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,100,255,.12)}
.stat:nth-child(2){animation-delay:.05s}.stat:nth-child(3){animation-delay:.1s}.stat:nth-child(4){animation-delay:.15s}.stat:nth-child(5){animation-delay:.2s}
.stat.big{background-size:200% 200%;animation:up .5s both,gradmove 10s ease infinite}
@keyframes gradmove{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
tbody tr{animation:up .35s ease both}
.btn{transition:.2s}.btn:active{transform:scale(.96)}
dialog[open]{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.passrow{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.passrow:last-child{border-bottom:0}
.pr-info{display:flex;flex-direction:column;min-width:0}.pr-info .mono{font-size:14px;word-break:break-all}.pr-info small{color:var(--mut)}
.pr-in{font-family:Consolas,monospace;font-weight:700}
@media(max-width:760px){.passrow{grid-template-columns:1fr}.passrow .btn{width:100%}.pr-cap{display:flex;align-items:center;gap:8px}}
.pr-cap{display:flex;align-items:center;gap:8px;white-space:nowrap}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.qa .btn{flex:1 1 170px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin-top:12px;cursor:pointer}.chk input{width:auto}
.capfree{color:var(--mut);font-size:12px;white-space:nowrap}
.ttlbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;background:#f1f6ff;border:1px solid #d6e4ff;border-radius:12px;padding:10px 14px;font-size:14px}
.ttlbox select{width:auto}
.exp{font-family:inherit;font-size:12px;font-weight:700;color:var(--acc);letter-spacing:0;margin-top:2px}.exp.low{color:var(--warn)}.exp.over{color:var(--bad)}
.capinfo{margin-top:14px}.capsum{font-size:14px;margin-bottom:8px}
.caprow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.caprow .capm{flex:1;min-width:0;word-break:break-all}
.capbar{display:inline-block;width:120px;height:10px;border-radius:9px;background:#e3eaf8;overflow:hidden;vertical-align:middle}
.capbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.capbar.hi i{background:linear-gradient(90deg,#f6b73c,#f08a1c)}.capbar.full i{background:linear-gradient(90deg,#f2706b,#d33)}
.capn{font-size:13px;min-width:48px;text-align:right}.capn.hi{color:var(--warn)}.capn.full{color:var(--bad)}
.caprow2{display:inline-flex;align-items:center;gap:8px}
.capwarn{margin-top:10px;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.grp{margin-top:10px}.grp small{color:var(--mut);display:block}
/* ---- funciones de gestión ---- */
.alerts{display:grid;gap:8px}
.alrt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer;transition:.2s}
.alrt:hover{transform:translateY(-1px);border-color:var(--acc)}
.alrt.b{background:var(--badbg);border-color:transparent}.alrt.w{background:var(--warnbg);border-color:transparent}
.avhead{font-size:13px;color:var(--mut);margin-bottom:6px}.avhead b{color:var(--text)}
.alert.done{opacity:.62}.avdone{color:var(--ok);font-weight:700;font-size:12px}
.due{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:118px}
.dcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11px;color:var(--mut)}
.dcol b{color:var(--text);font-size:12px;min-height:14px}.dcol i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--acc2),var(--acc))}
.dcol i.hot{background:linear-gradient(180deg,#f6b73c,#e8590c)}.dcol span{white-space:nowrap}
.duenote{margin-top:10px;font-size:13px;color:var(--mut)}.duenote b{color:var(--text)}
.prow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow.total{border-bottom:0;font-weight:800}.pr-n{display:flex;flex-direction:column;min-width:0}.pr-n .mono{font-size:13px;word-break:break-all}.pr-n small,.pr-c small{color:var(--mut);font-weight:600}
.pr-c{display:flex;flex-direction:column;gap:2px}.cost-in{padding:8px 10px;font-weight:700}.pos{color:var(--ok)}.neg{color:var(--bad)}
@media(max-width:760px){.prow{grid-template-columns:1fr 1fr}.pr-n{grid-column:1/-1}.due{height:104px}.dcol span{font-size:9px}}
dialog.gs{width:min(620px,94vw);padding:14px;top:8vh;margin:0 auto}
dialog.gs input{font-size:17px;padding:14px}.gsr{display:grid;gap:6px;margin-top:10px;max-height:56vh;overflow:auto}
.gsi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.gsi:hover,.gsi:focus{border-color:var(--acc);background:var(--soft)}.gsi small{color:var(--mut);word-break:break-all}.gsh{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}
dialog.set{width:min(640px,94vw)}dialog.set h3{margin:18px 0 6px;font-size:15px}dialog.set label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:10px 0 4px}
dialog.set textarea{font-size:13px}.sethelp{font-size:12px;color:var(--mut)}.sethelp code{background:var(--soft);padding:1px 6px;border-radius:6px;color:var(--acc)}
/* ---- modo oscuro ---- */
[data-theme=dark]{color-scheme:dark;--bg:#0e131d;--card:#171e2d;--line:#273149;--text:#e8edf8;--mut:#94a2bf;--soft:#1b2640;--okbg:#0f3a2b;--warnbg:#3b2e0b;--badbg:#3f1818;--acc:#4d8dff;--acc2:#2bb6ff}
[data-theme=dark] .bar,[data-theme=dark] .tabs,[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea,[data-theme=dark] .btn,[data-theme=dark] dialog{background:var(--card);color:var(--text)}
[data-theme=dark] .btn.p{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}
[data-theme=dark] .btn.s.p{color:#fff}
[data-theme=dark] tr:hover td,[data-theme=dark] .gsi:hover{background:#1b2540}
[data-theme=dark] .pcard{background:linear-gradient(180deg,#171e2d,#1b2640)}
[data-theme=dark] .ttlbox{background:#18233a;border-color:#2a3a5c}
[data-theme=dark] .newcode{background:#0f3a2b;border-color:#1b6b4d}
[data-theme=dark] .skel{background:linear-gradient(90deg,#171e2d 25%,#1f2940 50%,#171e2d 75%);background-size:200% 100%}
[data-theme=dark] .tabs button.on{color:#fff}
[data-theme=dark] .mini{background:#171e2d}
[data-theme=dark] .t-g,[data-theme=dark] .t-nc{background:#232d45;color:var(--mut)}
[data-theme=dark] ::backdrop{background:rgba(0,0,0,.65)}
.prog2{height:6px;border-radius:9px;background:#e3eaf8;overflow:hidden}.prog2 i{display:block;height:100%;background:var(--acc);transition:width .5s linear}
.skel{height:90px;border-radius:16px;background:linear-gradient(90deg,#eef1f7 25%,#f8faff 50%,#eef1f7 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}
.btn{min-height:40px}
@media(max-width:760px){
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:40;margin:0;border-radius:18px 18px 0 0;border-width:1px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;box-shadow:0 -8px 28px rgba(30,60,120,.12);flex-wrap:nowrap}
  .tabs button{flex-direction:column;gap:0;padding:7px 4px;font-size:11px;min-height:54px;border-radius:14px}
  .tabs button i{font-size:21px;line-height:1.15;transition:transform .25s}
  .tabs button.on i{transform:translateY(-2px) scale(1.12)}
  main{padding-bottom:104px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;font-size:30px;line-height:1;box-shadow:0 10px 26px rgba(30,100,255,.45);z-index:41;cursor:pointer;animation:pop .4s}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
  .acts .btn.s{flex:1 1 calc(50% - 6px);min-height:44px}
  .alert .btn{flex:1 1 40%}
  .bar-in{flex-wrap:nowrap}.bar h1{font-size:15px}.sp{gap:6px}.sp #who{display:none}
  .bar{position:static}
  .bar-in{padding:10px 14px}.bar h1{font-size:16px}.bar img{height:40px}
  main{padding:14px 12px 60px}
  .card{padding:16px 14px;border-radius:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tools input,.tools select{max-width:none;width:100%}
  .tools .btn{width:100%}
  table,thead,tbody,tr,td{display:block;min-width:0}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;background:#fff}
  td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  td::before{content:attr(data-l);color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;text-align:left;flex:none}
  td[data-l=""]::before{display:none}
  td.acts-td{display:block;text-align:left}
  td.acts-td::before{display:none}
  tr:hover td{background:none}
  .newcode .mono{font-size:22px}
  .brow{grid-template-columns:70px 1fr}.brow span:last-child{grid-column:1/-1}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>
<noscript><p style="padding:20px;text-align:center">Activa JavaScript para usar esta página.</p></noscript>

  <a href="index.html"><img src="logo-main.webp" alt="IA Plus Colombia"></a>

</div></header>

<main id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>

<script src="admin.js"></script>
</body>
</html>
