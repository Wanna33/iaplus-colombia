<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estado de tu pago | IA Plus Colombia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="theme-color" content="#ef5350">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:#f5f5f7;color:#1d1d22;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:#fff;border-radius:26px;box-shadow:0 18px 50px rgba(239,83,80,.18);padding:34px 28px;width:min(480px,100%);text-align:center}
.box img.lg{height:84px;margin:0 auto 14px;display:block}
.ic{font-size:56px;line-height:1;margin:6px 0 10px}
h1{font-size:25px;margin-bottom:8px}p{color:#6f6f7a;margin-bottom:14px;font-weight:600}
.ref{font-family:Consolas,monospace;background:#f4f4f6;border-radius:10px;padding:6px 10px;font-size:13px;display:inline-block;margin-bottom:16px;word-break:break-all}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:14px;border-radius:14px;border:0;font:inherit;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.p{background:linear-gradient(90deg,#f0524f,#ff6f6b);color:#fff;box-shadow:0 8px 22px rgba(239,83,80,.32)}.g{background:#f4f4f6;color:#1d1d22}.w{background:#e7f8ee;color:#12814a}
.bar{height:8px;border-radius:9px;background:#eee;overflow:hidden;margin:6px 0 16px}.bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#ff6f6b,#f0524f);border-radius:9px;animation:mv 1.4s ease-in-out infinite}
@keyframes mv{0%{margin-left:-30%}100%{margin-left:100%}}
.spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="box" id="box"><img class="lg" src="logo-main.webp" alt="IA Plus Colombia"><div class="ic"><span class="spin">⏳</span></div><h1>Confirmando tu pago…</h1><p>Un momento, estamos verificando con Wompi.</p><div class="bar"><i></i></div></main>
<script src="pago.js"></script>
</body>
</html>
