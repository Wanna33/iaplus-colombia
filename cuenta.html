<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi suscripción | IA Plus Colombia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/brand-mark.svg?v=2" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/brand-mark-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#f5f5f7;--card:#fff;--line:#ececf0;--text:#1d1d22;--mut:#85858f;--red:#ef5350;--red2:#ff6f6b;--redbg:#fdeceb;--dark:#2c2c30;--ok:#12a36b;--okbg:#e3f7ee;--acc:#ef5350;--soft:#fdeceb}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
/* ---------- encabezado coral ---------- */
.top{background:linear-gradient(135deg,#f0524f,#ee5a56);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 4px 18px rgba(239,83,80,.28)}
.top-in{max-width:1320px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;gap:22px}
.logo img{height:54px;width:auto;display:block}
.nav{display:flex;gap:6px}
.nav a{padding:10px 16px;border-radius:14px;font-weight:700;font-size:17px;white-space:nowrap;transition:.2s}
.nav a:hover{background:rgba(255,255,255,.18)}
.search{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);border-radius:16px;padding:0 18px;max-width:640px;transition:.2s}
.search:focus-within{background:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.search svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:17px;font-weight:600;padding:14px 0;outline:none}
.search input::placeholder{color:rgba(255,255,255,.85)}
.pill{background:rgba(255,255,255,.2);padding:12px 20px;border-radius:16px;font-weight:700;font-size:17px;white-space:nowrap;transition:.2s}
.pill:hover{background:rgba(255,255,255,.32)}
.ibtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:#fff;cursor:pointer;transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9}
.avatar{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.55);overflow:hidden;cursor:pointer;background:#fff3;padding:0;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 12px);width:360px;max-width:92vw;background:#fff;color:var(--text);border-radius:22px;box-shadow:0 22px 60px rgba(30,20,20,.25);padding:22px 24px;display:none;z-index:50;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.menu.on{display:block}
.menu .who{font-size:20px;font-weight:800;word-break:break-all}
.menu .sub{color:var(--mut);font-weight:600;margin:2px 0 14px}
.menu .saved{background:linear-gradient(90deg,#14143c,#1d1d6b,#7a1f4a);color:#fff;border-radius:99px;text-align:center;padding:11px 14px;font-weight:700;font-size:15px;margin-bottom:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.menu a,.menu button.mi{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;text-align:left;padding:12px 4px;font-size:18px;font-weight:600;color:var(--text);cursor:pointer;border-radius:12px;transition:.15s}
.menu a:hover,.menu button.mi:hover{background:var(--redbg);color:var(--red)}
.menu .ic{width:34px;text-align:center;font-size:24px}
.menu .on{color:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
/* ---------- contenido ---------- */
main{max-width:1320px;margin:0 auto;padding:46px 28px 90px}
.ttl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ttl h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.01em}
.ttl h1 em{font-style:normal;text-decoration:underline;text-decoration-color:rgba(239,83,80,.35);text-decoration-thickness:4px;text-underline-offset:6px}
.tag{background:var(--red);color:#fff;border-radius:8px;padding:3px 12px;font-weight:800;font-size:15px}
.tabs{display:flex;gap:34px;border-bottom:1.5px solid var(--line);margin:34px 0 30px}
.tabs button{background:none;border:0;padding:14px 4px;font-size:20px;font-weight:700;color:var(--text);cursor:pointer;position:relative}
.tabs button.on{color:var(--red)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:3px;background:var(--red);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:30px;align-items:start}
/* tarjeta de suscripción */
.sub-card{background:var(--card);border-radius:28px;box-shadow:0 10px 36px rgba(40,30,30,.08);overflow:hidden;position:relative;animation:up .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sub-head{display:flex;align-items:center;gap:18px;padding:26px 26px 22px;background:#f4f4f6;flex-wrap:wrap}
.picon{width:70px;height:70px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);flex:none;font-size:34px}
.picon img{width:100%;height:100%;object-fit:cover}
.pname{flex:1;min-width:140px}
.pname h2{font-size:27px;font-weight:800;line-height:1.1}
.pname small{color:var(--mut);font-weight:700;font-size:15px}
.buyagain{background:var(--red);color:#fff;border-radius:99px;padding:15px 24px;font-weight:800;font-size:18px;box-shadow:0 8px 20px rgba(239,83,80,.32);white-space:nowrap;transition:.2s}
.buyagain:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(239,83,80,.4)}
.sub-body{padding:22px 26px 6px}
.banner{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--dark);color:#fff;border:0;border-radius:18px;padding:22px 24px;font-size:19px;font-weight:700;cursor:pointer;text-align:left;position:relative;transition:.2s}
.banner:hover{background:#38383d}
.banner::after{content:"";position:absolute;left:12%;right:55%;bottom:-8px;height:12px;background:linear-gradient(90deg,#ef5350,#7c4dff);filter:blur(10px);opacity:.7}
.banner .chev{font-size:22px;transition:transform .3s}
.banner[aria-expanded=true] .chev{transform:rotate(180deg)}
.banner b{color:#ff6f6b;font-size:24px}
.rows{margin-top:14px;position:relative}
.rw{display:flex;justify-content:space-between;gap:12px;padding:20px 2px;border-bottom:1.5px solid var(--line);font-size:19px}
.rw span:first-child{color:var(--mut);font-weight:600}
.rw span:last-child{font-weight:700;text-align:right}
.rw:last-child{border-bottom:0}
.stamp{position:absolute;right:6px;top:34px;transform:rotate(-14deg);border:4px double rgba(239,83,80,.55);color:rgba(239,83,80,.6);border-radius:50%;width:150px;height:150px;display:grid;place-items:center;font-size:30px;font-weight:800;letter-spacing:.04em;pointer-events:none;background:rgba(255,255,255,.35);animation:stamp .5s cubic-bezier(.2,.9,.3,1.4) both}
.stamp.okst{border-color:rgba(18,163,107,.5);color:rgba(18,163,107,.65);font-size:24px}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.8)}to{opacity:1;transform:rotate(-14deg) scale(1)}}
.prog{height:10px;border-radius:99px;background:#eee;margin:6px 2px 18px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red2),var(--red))}
.foot{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid var(--line);margin-top:10px;background:#f4f4f6}
.foot a{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px 10px;font-size:19px;font-weight:700;color:#a1a1ab;transition:.2s}
.foot a:first-child{border-right:1.5px solid var(--line)}
.foot a:hover{color:var(--red);background:var(--redbg)}
.foot .q{width:34px;height:34px;border-radius:50%;background:#b8b8c0;color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
.foot a:hover .q{background:var(--red)}
.expired .sub-head{background:#f0f0f2}
.expired .picon,.expired .pname h2{opacity:.55}
/* datos de acceso */
.access{display:none;padding:6px 26px 22px}
.access.on{display:block;animation:up .35s ease both}
.lbl{display:flex;align-items:center;gap:8px;font-weight:800;color:#44444c;margin:18px 0 8px;font-size:17px}
.lbl svg{width:20px;height:20px;stroke:#a0a0aa;fill:none;stroke-width:1.8}
.field{display:flex;align-items:center;gap:10px;background:#f7f7f9;border:1.5px solid var(--line);border-radius:16px;padding:10px 10px 10px 18px}
.field code{flex:1;min-width:0;font-family:inherit;font-size:clamp(17px,2.2vw,22px);font-weight:700;word-break:break-all}
.ib{width:46px;height:46px;border-radius:13px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--red);transition:.15s;flex:none}
.ib:hover{border-color:var(--red);background:var(--redbg)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
.ib.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tbox{border:2px solid var(--red);border-radius:18px;padding:14px 14px 12px 20px;background:#fff7f7}
.trow{display:flex;align-items:center;gap:12px}
.tcode{flex:1;font-size:clamp(30px,5vw,40px);font-weight:800;letter-spacing:.14em;color:var(--red);font-variant-numeric:tabular-nums}
.tcnt{width:46px;height:46px;border-radius:50%;background:var(--redbg);color:var(--red);display:grid;place-items:center;font-size:18px}
.tline{height:5px;border-radius:99px;background:#f6d4d3;margin-top:10px;overflow:hidden}
.tbar{display:block;height:100%;background:var(--red);transition:width 1s linear}
.cta{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:99px;background:var(--red);color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(239,83,80,.3);border:0;cursor:pointer;font-size:16px;transition:.2s}
.cta:hover{transform:translateY(-2px)}
.tbtn:disabled{opacity:.5;cursor:not-allowed!important;box-shadow:none}
.tnote{color:var(--mut);font-size:14px;margin-top:8px}
.how{margin-top:22px;border-top:1.5px dashed var(--line);padding-top:16px}
.how h3{font-size:18px;margin-bottom:10px}
.how ol{margin-left:22px;display:grid;gap:8px;color:#55555e;font-weight:600}
.how a.l{color:var(--red);font-weight:800}
.note{margin-top:14px;background:var(--redbg);border-radius:14px;padding:14px 16px;color:#5a3a39;font-size:15px;font-weight:600}
.note b{color:var(--red)}
.note summary{cursor:pointer;font-weight:800}
.note ol{margin:10px 0 0 18px;display:grid;gap:6px}
/* historial */
.hist{background:#fff;border-radius:24px;box-shadow:0 10px 36px rgba(40,30,30,.08);overflow:hidden}
.hist table{width:100%;border-collapse:collapse;font-size:17px}
.hist th{text-align:left;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.05em;padding:18px 22px;background:#f4f4f6}
.hist td{padding:18px 22px;border-top:1.5px solid var(--line);font-weight:600}
.st{display:inline-block;border-radius:99px;padding:5px 14px;font-size:14px;font-weight:800}
.st.a{background:var(--okbg);color:var(--ok)}.st.e{background:var(--redbg);color:var(--red)}
.nores{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0;font-size:18px;font-weight:600}
/* agregar código */
.addbox{margin-top:46px;background:#fff;border:2px dashed #f3b7b5;border-radius:26px;padding:28px;max-width:680px;animation:up .6s .1s both}
.addbox h3{font-size:22px;margin-bottom:4px}.addbox p{color:var(--mut);font-size:16px;margin-bottom:14px;font-weight:600}
.addrow{display:flex;gap:10px;flex-wrap:wrap}
.addrow input{flex:1;min-width:190px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#fff;color:var(--text)}
.addrow input:focus{outline:3px solid rgba(239,83,80,.2);border-color:var(--red)}
.adderr{color:var(--red);font-weight:700;margin-top:10px;font-size:15px}
.msg{max-width:560px;margin:90px auto;text-align:center}
.msg h2{font-size:28px;margin-bottom:10px}.msg p{color:var(--mut);margin-bottom:22px;font-weight:600}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.3}}
.toastc{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1d22;color:#fff;padding:11px 20px;border-radius:14px;font-weight:700;z-index:70;animation:up .25s both}
/* barra inferior (celular) */
.bn{display:none}
@media(max-width:1100px){
  .nav,.pill.hide-m{display:none}
}
@media(max-width:860px){
  .top-in{padding:12px 16px;gap:12px}
  .logo img{height:44px}
  .search{max-width:none}
  .search input{padding:11px 0;font-size:16px}
  .pill,.ibtn.hide-m{display:none}
  .avatar{width:44px;height:44px;font-size:18px}
  main{padding:26px 14px 100px}
  .tabs{gap:22px;margin:22px 0 20px}.tabs button{font-size:18px}
  .grid{grid-template-columns:1fr;gap:22px}
  .sub-head{padding:20px 18px 18px;gap:14px}
  .picon{width:60px;height:60px}.pname h2{font-size:23px}
  .buyagain{width:100%;text-align:center;padding:14px}
  .sub-body{padding:18px 18px 4px}.access{padding:4px 18px 18px}
  .banner{font-size:17px;padding:18px}
  .rw{font-size:17px;padding:17px 2px}
  .stamp{width:118px;height:118px;font-size:23px;top:26px}
  .foot a{padding:20px 6px;font-size:17px}
  .menu{position:fixed;left:12px;right:12px;top:68px;width:auto;max-width:none}
  .hist{overflow-x:auto}.hist table{min-width:560px}
  .addbox{padding:20px;border-radius:22px}
  .bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(40,30,30,.08)}
  .bn a,.bn button{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;font-weight:800;padding:6px 2px;border-radius:12px;cursor:pointer;min-height:52px;justify-content:center}
  .bn i{font-style:normal;font-size:21px;line-height:1.1}
  .bn a.on{color:#c9302d;background:var(--redbg)}.bn a:active,.bn button:active{background:var(--redbg)}
  #relogin{bottom:calc(84px + env(safe-area-inset-bottom))!important}
}
@media (display-mode: standalone){.bn button[data-install]{display:none}.bn{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== botones: orden claro y animaciones en lo importante ===== */
.foot{grid-template-columns:1fr 1fr}
.foot .buyagain{grid-column:1/-1;border-top:1.5px solid var(--line);border-right:0!important;background:var(--red);color:#fff;border-radius:0 0 18px 18px;padding:18px 10px;font-size:18px;box-shadow:none;animation:iapNudge 3.2s ease-in-out infinite}
.foot .buyagain:hover{background:#e0403d;color:#fff;transform:none;box-shadow:none}
.banner{background:linear-gradient(135deg,#ef5350,#ff8a65);box-shadow:0 10px 26px rgba(239,83,80,.35)}
.banner:hover{background:linear-gradient(135deg,#e0403d,#ff7a55)}
.banner::after{display:none}
.banner b{color:#fff}
.banner .chev{animation:iapBounce 1.6s ease-in-out infinite}
.banner[aria-expanded=true] .chev{animation:none}
.tbtn{width:100%;padding:16px 20px;font-size:17px;animation:iapGlow 2s ease-in-out infinite}
.tbtn:disabled{animation:none}
.task{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.task .trest{margin:0!important;text-align:center}
.tview .tcode{font-size:34px;letter-spacing:4px}
.field .ib{transition:.2s}
.field .ib:active{transform:scale(.9)}
.morebox .cta{animation:iapGlow 2s ease-in-out infinite}
@keyframes iapGlow{0%,100%{box-shadow:0 8px 20px rgba(239,83,80,.3),0 0 0 0 rgba(239,83,80,.45)}50%{box-shadow:0 8px 20px rgba(239,83,80,.3),0 0 0 12px rgba(239,83,80,0)}}
@keyframes iapBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes iapNudge{0%,88%,100%{transform:none}92%{transform:translateY(-3px)}96%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.tbtn,.banner .chev,.foot .buyagain,.morebox .cta{animation:none!important}}

/* ===== pulido de diseño y experiencia ===== */
html{-webkit-tap-highlight-color:transparent}
body{animation:iapFade .5s ease both}
@keyframes iapFade{from{opacity:0}to{opacity:1}}
.nav,.top{transition:box-shadow .3s,background .3s}
.nav.scrolled,.top.scrolled{box-shadow:0 8px 28px rgba(239,83,80,.18)}
button,.btn,.cta,.chip{-webkit-user-select:none;user-select:none}
.btn:active,.cta:active,.chip:active,.bn a:active,.bn button:active{transform:scale(.96)!important}
.bn a,.bn button{transition:transform .15s,background .2s,color .2s}
.bn .on,.bn a.on{position:relative}
.bn .on::after,.bn a.on::after{content:"";position:absolute;top:2px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:99px;background:var(--red,#ef5350)}
.card{overflow:hidden}
.card .ico img{transition:transform .35s}
.card:hover .ico img{transform:scale(1.18) rotate(-4deg)}
.card .btn{position:relative;overflow:hidden}
.card .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%)}
.card:hover .btn::after{transform:translateX(120%);transition:transform .8s}
.chip.on{transform:translateY(-1px)}
.skel{max-width:560px;margin:30px auto;padding:0 16px;display:grid;gap:14px}
.skel i{display:block;height:84px;border-radius:20px;background:linear-gradient(90deg,#f0f0f3 25%,#fbfbfc 45%,#f0f0f3 65%);background-size:200% 100%;animation:iapSkel 1.2s linear infinite}
.skel i:first-child{height:34px;width:60%}
.skel i:last-child{height:150px}
@keyframes iapSkel{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){body{animation:none}.skel i{animation:none}.card:hover .ico img{transform:none}}

.warn{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff4e5;border:1.5px solid #ffcc80;color:#8a4b00;border-radius:16px;padding:12px 16px;margin:0 0 12px;font-weight:600}
.warn.bad{background:#ffeaea;border-color:#f5a3a0;color:#9b1c1c}
.warn a{background:var(--red);color:#fff;border-radius:99px;padding:8px 16px;font-weight:800;white-space:nowrap;animation:iapGlow 2s ease-in-out infinite}
.ghostlink{margin-left:10px;color:var(--mut);font-weight:700;text-decoration:underline}

/* ===== rediseño: acabado profesional ===== */
:root{--ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
body{-webkit-font-smoothing:antialiased;background:radial-gradient(1000px 420px at 10% -5%,#ffe6e3 0%,transparent 60%),var(--bg)}
.top{background:linear-gradient(120deg,#ef4f4c,#f25d58 60%,#f46b5c)}
.top-in{transition:padding .3s var(--ease)}
.top.scrolled .top-in{padding-top:10px;padding-bottom:10px}
.logo img{transition:height .3s var(--ease)}
.top.scrolled .logo img{height:46px}
.avatar{transition:transform .3s var(--spring),box-shadow .3s}
.avatar:hover{transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.ttl h1{font-weight:900;letter-spacing:-.025em}
.tabs button{transition:color .2s}
.tabs button:hover{color:var(--red)}
.tabs button.on::after{animation:tabIn .35s var(--ease)}
@keyframes tabIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sub-card{border:1px solid var(--line);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.sub-card:hover{transform:translateY(-4px);box-shadow:0 6px 16px rgba(23,23,28,.06),0 28px 60px rgba(239,83,80,.16)}
.grid>.sub-card:nth-child(2){animation-delay:.08s}.grid>.sub-card:nth-child(3){animation-delay:.16s}.grid>.sub-card:nth-child(4){animation-delay:.24s}.grid>.sub-card:nth-child(n+5){animation-delay:.3s}
.sub-head{background:linear-gradient(180deg,#f7f7f9,#f2f2f5)}
.picon{transition:transform .5s var(--spring)}
.sub-card:hover .picon{transform:rotate(-6deg) scale(1.05)}
.banner{transition:transform .25s var(--ease),box-shadow .25s,background .3s}
.banner:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(239,83,80,.4)}
.banner:active{transform:scale(.98)}
.prog i{position:relative;overflow:hidden;animation:growW 1.2s var(--ease) both}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:sweep 2.4s ease-in-out 1.2s infinite}
@keyframes growW{from{width:0}}
@keyframes sweep{to{transform:translateX(100%)}}
.field{transition:border-color .2s,box-shadow .25s}
.field:hover{border-color:#f6c3c1}
.tbox{box-shadow:0 10px 26px rgba(239,83,80,.12)}
.addrow input{transition:border-color .2s,box-shadow .25s}
.addrow input:focus{outline:none;box-shadow:0 0 0 4px rgba(239,83,80,.14)}
.cta{position:relative;overflow:hidden}
.cta::before{content:"";position:absolute;top:0;left:-75%;width:50%;height:100%;background:linear-gradient(110deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);pointer-events:none}
.cta:hover::before{left:130%;transition:left .75s var(--ease)}
.toastc{display:flex;align-items:center;gap:8px;border-radius:16px;padding:12px 20px;box-shadow:0 18px 40px rgba(0,0,0,.28);animation:toastIn .4s var(--spring) both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
.menu{border:1px solid var(--line)}
.hist{border:1px solid var(--line)}
.hist tr{transition:background .2s}.hist tbody tr:hover,.hist tr:hover td{background:#fcfcfd}
.msg{animation:up .5s var(--ease) both}
.moremodal{position:fixed;inset:0;background:rgba(23,23,28,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80;animation:iapFade .25s both}
.morecard{position:relative;background:#fff;border-radius:24px;padding:24px 22px;max-width:440px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 40px 90px rgba(23,23,28,.3);animation:pop .35s var(--spring) both}
.morecard h3{margin:0 0 10px;font-weight:900}
.morecard .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:#f1f1f4;font-size:22px;line-height:1;cursor:pointer}
.mopt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.mopt small{display:block;color:var(--mut)}
.mgrp{margin:14px 0 2px;font-size:15px}
/* ===== estilo profesional: encabezado blanco, tipografía y paleta sobria ===== */
:root{--text:#0f172a;--mut:#64748b;--line:#e8edf3;--bg:#f8fafc;--dark:#0f172a}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(900px 400px at 90% -10%,rgba(255,106,92,.08),transparent 60%),var(--bg)}
.top{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);color:var(--text);box-shadow:none;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line);box-shadow:0 4px 20px rgba(15,23,42,.06)}
.nav a{color:var(--mut);font-weight:600;font-size:15px}
.nav a:hover{background:#f1f5f9;color:var(--text)}
.search{background:#f1f5f9;border:1px solid var(--line)}
.search:focus-within{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px rgba(239,83,80,.12)}
.search svg{stroke:#94a3b8}
.search input{color:var(--text);font-weight:500;font-size:15px}
.search input::placeholder{color:#94a3b8}
.pill{background:#fff;border:1px solid var(--line);color:var(--text);font-weight:600;font-size:15px}
.pill:hover{background:#f1f5f9}
.ibtn svg{stroke:var(--text)}
.ibtn:hover{background:#f1f5f9}
.avatar{border:2px solid #fff;box-shadow:0 0 0 1px var(--line);background:var(--redbg);color:var(--red)}
.avatar:hover{box-shadow:0 0 0 3px rgba(239,83,80,.2)}
.ttl h1{font-weight:800;letter-spacing:-.03em}
.tabs button{font-weight:600;font-size:18px}
.pname h2{font-weight:800;letter-spacing:-.02em}
.rw span:first-child{font-weight:500}
.rw span:last-child{font-weight:700}
.sub-card{border-radius:22px;box-shadow:0 1px 3px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06)}
.sub-card:hover{box-shadow:0 2px 6px rgba(15,23,42,.05),0 20px 48px rgba(15,23,42,.10)}
.banner{border-radius:14px;font-weight:700}
.banner .chev{animation:none}
.foot .buyagain{animation:none}
.tbtn,.warn a,.morebox .cta{animation:none}
.foot a{font-weight:600}
.how ol,.note{font-weight:500}
.menu{border-radius:18px}
.menu a,.menu button.mi{font-weight:600;font-size:16px}
@media(max-width:860px){
  .bn{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
  .bn i{transition:transform .35s var(--spring)}
  .bn a.on i{transform:translateY(-2px) scale(1.1)}
  .sub-card:hover{transform:none}
}
/* ---------- guía paso a paso ---------- */
.guiabtn{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
.guiabtn:hover{border-color:var(--red);color:var(--red)}
.guia-capa{position:fixed;inset:0;background:rgba(15,15,20,.12);z-index:80;animation:gFade .3s ease}
.guia-hl{position:relative;z-index:85;border-radius:16px;box-shadow:0 0 0 4px var(--red),0 0 0 9999px rgba(15,15,20,0);animation:gPulse 1.6s ease-in-out infinite;background:var(--card)}
.guia-caja{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(440px,calc(100% - 28px));background:var(--card);color:var(--text);border-radius:22px;padding:18px 18px 14px;z-index:90;
  box-shadow:0 24px 60px rgba(0,0,0,.28)}
.guia-caja.in{animation:gUp .35s cubic-bezier(.2,.8,.2,1)}
.guia-caja h3{font-size:19px;margin:8px 0 4px}.guia-caja p{color:var(--mut);font-size:15px;line-height:1.45}
.guia-dots{display:flex;gap:6px}.guia-dots i{width:22px;height:5px;border-radius:9px;background:var(--line);transition:.3s}.guia-dots i.on{background:var(--red);width:34px}.guia-dots i.ya{background:var(--red2)}
.guia-acts{display:flex;align-items:center;gap:8px;margin-top:14px}.guia-acts span{flex:1}
.guia-skip,.guia-back{border:0;background:none;color:var(--mut);font:inherit;font-weight:700;cursor:pointer;padding:8px 6px}
@keyframes gFade{from{opacity:0}to{opacity:1}}
@keyframes gUp{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes gPulse{0%,100%{box-shadow:0 0 0 4px var(--red)}50%{box-shadow:0 0 0 8px rgba(239,83,80,.45)}}
@media (prefers-reduced-motion:reduce){.guia-hl,.guia-caja.in,.guia-capa{animation:none}}
</style>
