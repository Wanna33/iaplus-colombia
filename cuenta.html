<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi suscripción | IA Plus Colombia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="theme-color" content="#ef5350">
<style>
:root{--bg:#f5f5f7;--card:#fff;--line:#ececf0;--text:#1d1d22;--mut:#85858f;--red:#ef5350;--red2:#ff6f6b;--redbg:#fdeceb;--dark:#2c2c30;--ok:#12a36b;--okbg:#e3f7ee;--acc:#ef5350;--soft:#fdeceb}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
/* ---------- encabezado coral ---------- */
.top{background:linear-gradient(135deg,#f0524f,#ee5a56);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 4px 18px rgba(239,83,80,.28)}
.top-in{max-width:1320px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;gap:22px}
.logo img{height:54px;width:auto;display:block}
.nav{display:flex;gap:6px}
.nav a{padding:10px 16px;border-radius:14px;font-weight:700;font-size:17px;white-space:nowrap;transition:.2s}
.nav a:hover{background:rgba(255,255,255,.18)}
.search{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);border-radius:16px;padding:0 18px;max-width:640px;transition:.2s}
.search:focus-within{background:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.search svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:17px;font-weight:600;padding:14px 0;outline:none}
.search input::placeholder{color:rgba(255,255,255,.85)}
.pill{background:rgba(255,255,255,.2);padding:12px 20px;border-radius:16px;font-weight:700;font-size:17px;white-space:nowrap;transition:.2s}
.pill:hover{background:rgba(255,255,255,.32)}
.ibtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:#fff;cursor:pointer;transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9}
.avatar{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.55);overflow:hidden;cursor:pointer;background:#fff3;padding:0;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 12px);width:360px;max-width:92vw;background:#fff;color:var(--text);border-radius:22px;box-shadow:0 22px 60px rgba(30,20,20,.25);padding:22px 24px;display:none;z-index:50;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.menu.on{display:block}
.menu .who{font-size:20px;font-weight:800;word-break:break-all}
.menu .sub{color:var(--mut);font-weight:600;margin:2px 0 14px}
.menu .saved{background:linear-gradient(90deg,#14143c,#1d1d6b,#7a1f4a);color:#fff;border-radius:99px;text-align:center;padding:11px 14px;font-weight:700;font-size:15px;margin-bottom:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.menu a,.menu button.mi{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;text-align:left;padding:12px 4px;font-size:18px;font-weight:600;color:var(--text);cursor:pointer;border-radius:12px;transition:.15s}
.menu a:hover,.menu button.mi:hover{background:var(--redbg);color:var(--red)}
.menu .ic{width:34px;text-align:center;font-size:24px}
.menu .on{color:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
/* ---------- contenido ---------- */
main{max-width:1320px;margin:0 auto;padding:46px 28px 90px}
.ttl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ttl h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.01em}
.ttl h1 em{font-style:normal;text-decoration:underline;text-decoration-color:rgba(239,83,80,.35);text-decoration-thickness:4px;text-underline-offset:6px}
.tag{background:var(--red);color:#fff;border-radius:8px;padding:3px 12px;font-weight:800;font-size:15px}
.tabs{display:flex;gap:34px;border-bottom:1.5px solid var(--line);margin:34px 0 30px}
.tabs button{background:none;border:0;padding:14px 4px;font-size:20px;font-weight:700;color:var(--text);cursor:pointer;position:relative}
.tabs button.on{color:var(--red)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:3px;background:var(--red);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:30px;align-items:start}
/* tarjeta de suscripción */
.sub-card{background:var(--card);border-radius:28px;box-shadow:0 10px 36px rgba(40,30,30,.08);overflow:hidden;position:relative;animation:up .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sub-head{display:flex;align-items:center;gap:18px;padding:26px 26px 22px;background:#f4f4f6;flex-wrap:wrap}
.picon{width:70px;height:70px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);flex:none;font-size:34px}
.picon img{width:100%;height:100%;object-fit:cover}
.pname{flex:1;min-width:140px}
.pname h2{font-size:27px;font-weight:800;line-height:1.1}
.pname small{color:var(--mut);font-weight:700;font-size:15px}
.buyagain{background:var(--red);color:#fff;border-radius:99px;padding:15px 24px;font-weight:800;font-size:18px;box-shadow:0 8px 20px rgba(239,83,80,.32);white-space:nowrap;transition:.2s}
.buyagain:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(239,83,80,.4)}
.sub-body{padding:22px 26px 6px}
.banner{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--dark);color:#fff;border:0;border-radius:18px;padding:22px 24px;font-size:19px;font-weight:700;cursor:pointer;text-align:left;position:relative;transition:.2s}
.banner:hover{background:#38383d}
.banner::after{content:"";position:absolute;left:12%;right:55%;bottom:-8px;height:12px;background:linear-gradient(90deg,#ef5350,#7c4dff);filter:blur(10px);opacity:.7}
.banner .chev{font-size:22px;transition:transform .3s}
.banner[aria-expanded=true] .chev{transform:rotate(180deg)}
.banner b{color:#ff6f6b;font-size:24px}
.rows{margin-top:14px;position:relative}
.rw{display:flex;justify-content:space-between;gap:12px;padding:20px 2px;border-bottom:1.5px solid var(--line);font-size:19px}
.rw span:first-child{color:var(--mut);font-weight:600}
.rw span:last-child{font-weight:700;text-align:right}
.rw:last-child{border-bottom:0}
.stamp{position:absolute;right:6px;top:34px;transform:rotate(-14deg);border:4px double rgba(239,83,80,.55);color:rgba(239,83,80,.6);border-radius:50%;width:150px;height:150px;display:grid;place-items:center;font-size:30px;font-weight:800;letter-spacing:.04em;pointer-events:none;background:rgba(255,255,255,.35);animation:stamp .5s cubic-bezier(.2,.9,.3,1.4) both}
.stamp.okst{border-color:rgba(18,163,107,.5);color:rgba(18,163,107,.65);font-size:24px}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.8)}to{opacity:1;transform:rotate(-14deg) scale(1)}}
.prog{height:10px;border-radius:99px;background:#eee;margin:6px 2px 18px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red2),var(--red))}
.foot{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid var(--line);margin-top:10px;background:#f4f4f6}
.foot a{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px 10px;font-size:19px;font-weight:700;color:#a1a1ab;transition:.2s}
.foot a:first-child{border-right:1.5px solid var(--line)}
.foot a:hover{color:var(--red);background:var(--redbg)}
.foot .q{width:34px;height:34px;border-radius:50%;background:#b8b8c0;color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
.foot a:hover .q{background:var(--red)}
.expired .sub-head{background:#f0f0f2}
.expired .picon,.expired .pname h2{opacity:.55}
/* datos de acceso */
.access{display:none;padding:6px 26px 22px}
.access.on{display:block;animation:up .35s ease both}
.lbl{display:flex;align-items:center;gap:8px;font-weight:800;color:#44444c;margin:18px 0 8px;font-size:17px}
.lbl svg{width:20px;height:20px;stroke:#a0a0aa;fill:none;stroke-width:1.8}
.field{display:flex;align-items:center;gap:10px;background:#f7f7f9;border:1.5px solid var(--line);border-radius:16px;padding:10px 10px 10px 18px}
.field code{flex:1;min-width:0;font-family:inherit;font-size:clamp(17px,2.2vw,22px);font-weight:700;word-break:break-all}
.ib{width:46px;height:46px;border-radius:13px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--red);transition:.15s;flex:none}
.ib:hover{border-color:var(--red);background:var(--redbg)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
.ib.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tbox{border:2px solid var(--red);border-radius:18px;padding:14px 14px 12px 20px;background:#fff7f7}
.trow{display:flex;align-items:center;gap:12px}
.tcode{flex:1;font-size:clamp(30px,5vw,40px);font-weight:800;letter-spacing:.14em;color:var(--red);font-variant-numeric:tabular-nums}
.tcnt{width:46px;height:46px;border-radius:50%;background:var(--redbg);color:var(--red);display:grid;place-items:center;font-size:18px}
.tline{height:5px;border-radius:99px;background:#f6d4d3;margin-top:10px;overflow:hidden}
.tbar{display:block;height:100%;background:var(--red);transition:width 1s linear}
.cta{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:99px;background:var(--red);color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(239,83,80,.3);border:0;cursor:pointer;font-size:16px;transition:.2s}
.cta:hover{transform:translateY(-2px)}
.tbtn:disabled{opacity:.5;cursor:not-allowed!important;box-shadow:none}
.tnote{color:var(--mut);font-size:14px;margin-top:8px}
.how{margin-top:22px;border-top:1.5px dashed var(--line);padding-top:16px}
.how h3{font-size:18px;margin-bottom:10px}
.how ol{margin-left:22px;display:grid;gap:8px;color:#55555e;font-weight:600}
.how a.l{color:var(--red);font-weight:800}
.note{margin-top:14px;background:var(--redbg);border-radius:14px;padding:14px 16px;color:#5a3a39;font-size:15px;font-weight:600}
.note b{color:var(--red)}
.note summary{cursor:pointer;font-weight:800}
.note ol{margin:10px 0 0 18px;display:grid;gap:6px}
/* historial */
.hist{background:#fff;border-radius:24px;box-shadow:0 10px 36px rgba(40,30,30,.08);overflow:hidden}
.hist table{width:100%;border-collapse:collapse;font-size:17px}
.hist th{text-align:left;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.05em;padding:18px 22px;background:#f4f4f6}
.hist td{padding:18px 22px;border-top:1.5px solid var(--line);font-weight:600}
.st{display:inline-block;border-radius:99px;padding:5px 14px;font-size:14px;font-weight:800}
.st.a{background:var(--okbg);color:var(--ok)}.st.e{background:var(--redbg);color:var(--red)}
.nores{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0;font-size:18px;font-weight:600}
/* agregar código */
.addbox{margin-top:46px;background:#fff;border:2px dashed #f3b7b5;border-radius:26px;padding:28px;max-width:680px;animation:up .6s .1s both}
.addbox h3{font-size:22px;margin-bottom:4px}.addbox p{color:var(--mut);font-size:16px;margin-bottom:14px;font-weight:600}
.addrow{display:flex;gap:10px;flex-wrap:wrap}
.addrow input{flex:1;min-width:190px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#fff;color:var(--text)}
.addrow input:focus{outline:3px solid rgba(239,83,80,.2);border-color:var(--red)}
.adderr{color:var(--red);font-weight:700;margin-top:10px;font-size:15px}
.msg{max-width:560px;margin:90px auto;text-align:center}
.msg h2{font-size:28px;margin-bottom:10px}.msg p{color:var(--mut);margin-bottom:22px;font-weight:600}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.3}}
.toastc{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1d22;color:#fff;padding:11px 20px;border-radius:14px;font-weight:700;z-index:70;animation:up .25s both}
/* barra inferior (celular) */
.bn{display:none}
@media(max-width:1100px){
  .nav,.pill.hide-m{display:none}
}
@media(max-width:860px){
  .top-in{padding:12px 16px;gap:12px}
  .logo img{height:44px}
  .search{max-width:none}
  .search input{padding:11px 0;font-size:16px}
  .pill,.ibtn.hide-m{display:none}
  .avatar{width:44px;height:44px;font-size:18px}
  main{padding:26px 14px 100px}
  .tabs{gap:22px;margin:22px 0 20px}.tabs button{font-size:18px}
  .grid{grid-template-columns:1fr;gap:22px}
  .sub-head{padding:20px 18px 18px;gap:14px}
  .picon{width:60px;height:60px}.pname h2{font-size:23px}
  .buyagain{width:100%;text-align:center;padding:14px}
  .sub-body{padding:18px 18px 4px}.access{padding:4px 18px 18px}
  .banner{font-size:17px;padding:18px}
  .rw{font-size:17px;padding:17px 2px}
  .stamp{width:118px;height:118px;font-size:23px;top:26px}
  .foot a{padding:20px 6px;font-size:17px}
  .menu{position:fixed;left:12px;right:12px;top:68px;width:auto;max-width:none}
  .hist{overflow-x:auto}.hist table{min-width:560px}
  .addbox{padding:20px;border-radius:22px}
  .bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(40,30,30,.08)}
  .bn a,.bn button{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;font-weight:800;padding:6px 2px;border-radius:12px;cursor:pointer;min-height:52px;justify-content:center}
  .bn i{font-style:normal;font-size:21px;line-height:1.1}
  .bn a.on{color:var(--red);background:var(--redbg)}.bn a:active,.bn button:active{background:var(--redbg)}
  #relogin{bottom:calc(84px + env(safe-area-inset-bottom))!important}
}
@media (display-mode: standalone){.bn button[data-install]{display:none}.bn{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<noscript><p style="padding:20px;text-align:center">Activa JavaScript para usar esta página.</p></noscript>
<header class="top"><div class="top-in">

  <nav class="nav"><a href="index.html?tienda=1#catalogo">Catálogo</a><a href="index.html?tienda=1#porque">Beneficios</a><a href="index.html?tienda=1#faq">Ayuda</a></nav>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Buscar en mis suscripciones" autocomplete="off" aria-label="Buscar en mis suscripciones"></label>
  <a class="pill hide-m" href="cuenta.html">Mi suscripción</a>
  <a class="ibtn hide-m" id="topWa" target="_blank" rel="noopener" aria-label="Soporte por WhatsApp"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z"/><path d="M9 10.5c.5 2 2.5 4 4.5 4.5l1.5-1.5-2-1-1 .5c-.7-.3-1.5-1.1-1.8-1.8l.5-1-1-2-1.5 1.5"/></svg></a>
  <div class="menuwrap"><button class="avatar" id="avBtn" aria-label="Menú de usuario" aria-haspopup="true">👤</button><div class="menu" id="menu" role="menu"></div></div>
</div></header>
<main id="app"><div class="msg"><p>Cargando tu suscripción…</p></div></main>

<nav class="bn" aria-label="Navegación">
  <a href="cuenta.html" class="on"><i>🔑</i><span>Mi cuenta</span></a>

  <button type="button" data-install><i>📲</i><span>Instalar</span></button>
</nav>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyIINkQAuYouCXVr722gi_8K1dHPLeF6N5XlmzHgCRA0ETF4cBc-VpIw0933mz1lFg8qA/exec";
const WHATSAPP = "573102035327";
const DAY = 86400000;
const CLIENT_ID = "912360874722-idm6s6ujebsi7bbvmduq7ql88efb9uq9.apps.googleusercontent.com";
const ADMIN = "j03l1525@gmail.com";
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const fmt = d => d.toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"});
const fmtT = d => d.toLocaleDateString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric"})+", "+d.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",hour12:false});
function parseJwt(t){ const b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(atob(b).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""))); }
let credP = null;
function ensureCred(){
  const c = load("iap_cred");
  if(c && c.exp > Date.now()+30000) return Promise.resolve(c);
  if(credP) return credP;
  credP = new Promise(resolve=>{
    let bar = document.getElementById("relogin");
    if(!bar){ bar = document.createElement("div"); bar.id="relogin";
      bar.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(20,40,90,.25);z-index:60;text-align:center";
      bar.innerHTML='<div style="font-weight:800;margin-bottom:8px">Confirma tu cuenta para continuar</div><div id="relBtn" style="display:flex;justify-content:center"></div>';
      document.body.appendChild(bar); }
    const init = () => {
      if(!window.google?.accounts?.id){ return setTimeout(init,300); }
      google.accounts.id.initialize({client_id:CLIENT_ID, auto_select:true, callback:r=>{
        const p=parseJwt(r.credential); const cr={token:r.credential,exp:p.exp*1000};
        save("iap_cred",cr); save("iap_user",{email:p.email,name:p.name||p.email,picture:p.picture||""});
        bar.remove(); credP=null; resolve(cr);
      }});
      google.accounts.id.renderButton(document.getElementById("relBtn"),{theme:"outline",size:"large",shape:"pill",locale:"es"});
      try{ google.accounts.id.prompt(); }catch{}
    };
    init();
  });
  return credP;
}
async function callApi(body){
  const cred = await ensureCred();
  const r = await fetch(API_URL,{method:"POST",body:JSON.stringify({...body, idToken:cred.token})});
  const j = await r.json();
  if(!j.ok && /sesión venció|Inicia sesión/i.test(j.error||"")){ try{ localStorage.removeItem("iap_cred"); }catch{} return callApi(body); }
  return j;
}
/* ---------- código de autenticación (2FA) ---------- */
const totpState = {};
function totpRest(box){
  const st=totpState[box.dataset.totp]||{};
  if(st.rest!==undefined) return st.rest;
  return box.dataset.rest===""||box.dataset.rest===undefined ? null : +box.dataset.rest;
}
async function fetchTotp(box, ask){
  const mail=box.dataset.totp, st=totpState[mail]=totpState[mail]||{};
  if(st.busy) return; st.busy=true; if(ask) st.err="";
  const btn=box.querySelector("[data-ask]"); if(ask){ btn.disabled=true; btn.textContent="Pidiendo…"; }
  try{
    const j=await callApi({action:"totp",v:2,ask:!!ask,correo:mail});
    if(!j.ok){ if(/SESION_2FA/.test(j.error||"")){ st.sesion=0; st.code=""; } else throw new Error(j.error||"Error"); }
    else { st.code=j.code; st.until=Date.now()+j.left*1000; st.rest=j.restantes; st.sesion=j.hasta||(Date.now()+600000); st.err=""; }
  }catch(err){ st.err=err.message; if(ask) st.sesion=0; }
  st.busy=false; renderTotp();
}
function askTotp(box){ return fetchTotp(box,true); }
function renderTotp(){
  const now=Date.now();
  for(const box of document.querySelectorAll("[data-totp]")){
    const st=totpState[box.dataset.totp]||{}, rest=totpRest(box);
    const active = st.code && st.sesion && st.sesion>now;
    if(active && st.until<=now && !st.busy) fetchTotp(box,false); // el código sigue circulando solo
    box.querySelector(".tview").hidden=!active;
    box.querySelector(".task").hidden=!!active;
    if(active){
      const left=Math.max(0,Math.ceil((st.until-now)/1000));
      box.querySelector(".tcode").textContent=st.code.slice(0,3)+" "+st.code.slice(3);
      box.querySelector(".tcopy").dataset.copy=st.code;
      box.querySelector(".tleft").textContent=left;
      box.querySelector(".tbar").style.width=(left/30*100)+"%";
      const m=Math.max(0,Math.ceil((st.sesion-now)/60000));
      box.querySelector(".tnote").textContent="El código se renueva solo durante "+m+" min más. Después tendrás que volver a pedirlo.";
    } else {
      const btn=box.querySelector("[data-ask]");
      const none = rest!==null && rest<=0;
      btn.disabled=none||!!st.busy;
      btn.textContent=none?"Sin códigos disponibles":"Pedir código de autenticación";
      box.querySelector(".trest").textContent = rest===null ? "" : (none ? "Ya usaste tus "+(box.dataset.max||3)+" pedidos." : "Te quedan "+rest+" de "+(box.dataset.max||3)+" pedidos.");
      box.querySelector(".tnote").textContent = st.err ? st.err : (none ? "Si necesitas ayuda, escríbenos por WhatsApp." : "Al pedirlo se descuenta 1 de tus "+(box.dataset.max||3)+" pedidos. Luego el código se renueva solo durante 10 minutos.");
    }
  }
}
function refreshTotp(){ renderTotp(); }

  return navigator.clipboard?.writeText ? navigator.clipboard.writeText(t).catch(fb) : fb();
}
