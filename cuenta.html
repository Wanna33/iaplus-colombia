<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu cuenta | IA Plus Colombia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.webp" type="image/webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IA Plus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="theme-color" content="#1e6bff">
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e6ebf4;--text:#101a33;--mut:#5f6f8c;--acc:#1e6bff;--acc2:#12a8ff;--ok:#12a36b;--okbg:#e3f7ee;--soft:#eef4ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
a{color:inherit;text-decoration:none}
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar-in{max-width:1240px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding-right:18px;border-right:1px solid var(--line)}
.brand img{height:40px;background:#000;border-radius:10px;padding:2px 5px}
.prod{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--okbg);color:var(--ok);font-size:14px;font-weight:700;padding:5px 12px;border-radius:99px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.badge.off{background:#fde8e8;color:#d33}.badge.off::before{background:#d33}
.meta{margin-left:auto;display:flex;gap:18px;color:var(--mut);font-size:15px;flex-wrap:wrap;align-items:center}
.meta b{color:var(--text)}
.meta .sep{width:1px;height:22px;background:var(--line)}
.back{border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:14px;color:var(--text);background:#fff}
.back:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
.acct{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;align-items:start}
.acct+.acct{margin-top:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:0 10px 30px rgba(30,60,120,.06)}
.card h1{font-size:clamp(24px,3.4vw,32px);line-height:1.2;letter-spacing:-.01em}
.card .lead{color:var(--mut);margin:12px 0 20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.lbl{display:flex;align-items:center;gap:8px;font-weight:800;color:#33425f;margin:18px 0 8px;font-size:17px}
.lbl svg{width:20px;height:20px;stroke:#7b8aa6;fill:none;stroke-width:1.8}
.field{display:flex;align-items:center;gap:10px;background:#f7f9fd;border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 20px}
.field code{flex:1;min-width:0;font-family:inherit;font-size:clamp(17px,2.4vw,23px);font-weight:600;word-break:break-all}
.ib{width:48px;height:48px;border-radius:13px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--acc);transition:.15s;flex:none}
.ib:hover{border-color:var(--acc);background:var(--soft)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
.ib.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tbox{border:2px solid var(--acc);border-radius:18px;padding:14px 14px 12px 20px;background:#f3f8ff}
.trow{display:flex;align-items:center;gap:12px}
.tcode{flex:1;font-size:clamp(30px,5vw,42px);font-weight:800;letter-spacing:.14em;color:var(--acc);font-variant-numeric:tabular-nums}
.tcnt{width:46px;height:46px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:18px}
.tline{height:5px;border-radius:99px;background:#dbe6fb;margin-top:10px;overflow:hidden}
.tbar{display:block;height:100%;background:var(--acc);transition:width 1s linear}
.tbtn:disabled{opacity:.5;cursor:not-allowed!important;box-shadow:none}
.tnote{color:var(--mut);font-size:14px;margin-top:8px}
.plan{margin-top:26px;border:1.5px solid #cfe0ff;background:linear-gradient(180deg,#f3f8ff,#fff);border-radius:20px;padding:20px}
.plan h3{font-size:17px;color:#33425f;display:flex;align-items:center;gap:8px}
.days{font-size:46px;font-weight:800;color:var(--acc);line-height:1.1;margin-top:6px}
.days small{font-size:16px;color:var(--mut);font-weight:600;margin-left:6px}
.clock{color:var(--mut);margin-top:2px}.clock b{color:var(--text);font-variant-numeric:tabular-nums}
.prog{height:10px;border-radius:99px;background:#e3eaf8;margin:14px 0 8px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.dates{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding:14px;border-radius:14px;border:1px solid var(--line);font-weight:700;color:#1a8f55;background:#f1fbf6}
.wa:hover{border-color:#1a8f55}
.steps{padding:6px 4px}
.steps h2{font-size:22px;margin:0 0 18px 6px}
.step{position:relative;display:grid;grid-template-columns:44px 1fr;gap:16px;padding-bottom:26px}
.step:not(:last-child)::before{content:"";position:absolute;left:21px;top:46px;bottom:4px;width:2px;background:#dfe6f3}
.num{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(30,107,255,.35)}
.step h3{font-size:20px;margin:8px 0 4px}
.step p{color:var(--mut)}
.mock{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:520px;box-shadow:0 8px 24px rgba(30,60,120,.08)}
.mock .t{font-size:22px;font-weight:700;margin-bottom:14px;text-align:center}
.mock .in{border:1.5px solid #d6deec;border-radius:12px;padding:13px 16px;color:#7b8aa6;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.mock .in.hl{border-color:var(--acc);color:var(--text);box-shadow:0 0 0 3px rgba(30,107,255,.15)}
.mock .go{background:#0b0f1a;color:#fff;text-align:center;padding:13px;border-radius:99px;font-weight:700}
.cta{display:inline-flex;margin-top:14px;padding:13px 22px;border-radius:12px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;font-weight:700;box-shadow:0 8px 22px rgba(30,107,255,.3)}
.cta:hover{transform:translateY(-2px)}
.note{margin-top:6px;background:var(--soft);border:1px solid #d6e4ff;border-radius:16px;padding:16px 18px;color:#33425f;font-size:15px}
.note b{color:var(--acc)}
.msg{max-width:560px;margin:70px auto;text-align:center}
.msg h2{font-size:28px;margin-bottom:10px}.msg p{color:var(--mut);margin-bottom:22px}
.expired .days{color:#d33}
.addbox{margin-top:34px;background:var(--card);border:2px dashed #b9d0ff;border-radius:22px;padding:22px;max-width:640px}
.addbox h3{font-size:19px;margin-bottom:4px}.addbox p{color:var(--mut);font-size:14px;margin-bottom:12px}
.addrow{display:flex;gap:10px;flex-wrap:wrap}
.addrow input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;letter-spacing:.05em;text-transform:uppercase;background:#fff;color:var(--text)}
.addrow input:focus{outline:2px solid rgba(30,107,255,.3);border-color:var(--acc)}
.addrow button{border:0;cursor:pointer;font:inherit}
.adderr{color:#d33;font-weight:600;margin-top:10px;font-size:14px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.3}}
@media(max-width:980px){.acct{grid-template-columns:1fr}.brand{border:0;padding:0}.meta{margin-left:0}.meta .sep{display:none}}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}
@media(max-width:600px){
  .bar{position:static}
  .bar-in{padding:10px 14px;gap:10px}
  .brand img{height:34px}
  .prod{font-size:17px}
  .meta{width:100%;gap:10px;font-size:13px;justify-content:space-between}
  main{padding:14px 12px 50px}
  .acct{gap:16px}
  .card{padding:20px 16px;border-radius:20px}
  .card h1{font-size:23px}
  .field{padding:8px 8px 8px 14px;gap:8px}
  .field code{font-size:16px}
  .ib{width:44px;height:44px}
  .days{font-size:38px}
  .dates{font-size:12px}
  .tcode{font-size:30px;letter-spacing:.08em}
  .steps h2{font-size:19px}
  .step{grid-template-columns:36px 1fr;gap:12px}
  .num{width:36px;height:36px;font-size:15px}
  .step:not(:last-child)::before{left:17px;top:38px}
  .step h3{font-size:17px;margin-top:4px}
  .mock{padding:16px;max-width:100%}
  .mock .t{font-size:18px}
  .cta{width:100%;justify-content:center}
}

.bn{display:none}
@media(max-width:760px){
  .bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(30,60,120,.08)}
  .bn a,.bn button{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px;cursor:pointer;min-height:52px;justify-content:center}
  .bn i{font-style:normal;font-size:21px;line-height:1.1}
  .bn a.on{color:var(--acc);background:var(--soft)}.bn a:active,.bn button:active{background:var(--soft)}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .back{display:none}
  .meta{justify-content:flex-start}
  .field{flex-wrap:nowrap}
  .ib{width:48px;height:48px}
  .tcode{font-size:34px}
  .card{animation:cup .5s cubic-bezier(.2,.7,.2,1) both}
  .steps{animation:cup .6s .1s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes cup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (display-mode: standalone){.bn button[data-install]{display:none}.bn{grid-template-columns:repeat(4,1fr)}}
.toastc{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#101a33;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;animation:cup .25s both}
</style>
</head>
<body>
<noscript><p style="padding:20px;text-align:center">Activa JavaScript para usar esta página.</p></noscript>
<header class="bar"><div class="bar-in" id="bar">
  <a class="brand" href="index.html?tienda=1"><img src="logo.webp" alt="IA Plus Colombia"></a>
  <div class="prod">Mi cuenta</div>
  <div class="meta"><a class="back" href="index.html?tienda=1">← Volver a la tienda</a></div>
</div></header>
<main id="app"><div class="msg"><p>Cargando tu cuenta…</p></div></main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyIINkQAuYouCXVr722gi_8K1dHPLeF6N5XlmzHgCRA0ETF4cBc-VpIw0933mz1lFg8qA/exec";
const WHATSAPP = "573102035327";
const DAY = 86400000;
const CLIENT_ID = "912360874722-idm6s6ujebsi7bbvmduq7ql88efb9uq9.apps.googleusercontent.com";
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function parseJwt(t){ const b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(atob(b).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""))); }
let credP = null;
function ensureCred(){
  const c = load("iap_cred");
  if(c && c.exp > Date.now()+30000) return Promise.resolve(c);
  if(credP) return credP;
  credP = new Promise(resolve=>{
    let bar = document.getElementById("relogin");
    if(!bar){ bar = document.createElement("div"); bar.id="relogin";
      bar.style.cssText="position:fixed;left:12px;right:12px;bottom:14px;max-width:460px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(20,40,90,.25);z-index:60;text-align:center";
      bar.innerHTML='<div style="font-weight:700;margin-bottom:8px">Confirma tu cuenta para continuar</div><div id="relBtn" style="display:flex;justify-content:center"></div>';
      document.body.appendChild(bar); }
    const init = () => {
      if(!window.google?.accounts?.id){ return setTimeout(init,300); }
      google.accounts.id.initialize({client_id:CLIENT_ID, auto_select:true, callback:r=>{
        const p=parseJwt(r.credential); const cr={token:r.credential,exp:p.exp*1000};
        save("iap_cred",cr); save("iap_user",{email:p.email,name:p.name||p.email,picture:p.picture||""});
        bar.remove(); credP=null; resolve(cr);
      }});
      google.accounts.id.renderButton(document.getElementById("relBtn"),{theme:"outline",size:"large",shape:"pill",locale:"es"});
      try{ google.accounts.id.prompt(); }catch{}
    };
    init();
  });
  return credP;
}
async function callApi(body){
  const cred = await ensureCred();
  const r = await fetch(API_URL,{method:"POST",body:JSON.stringify({...body, idToken:cred.token})});
  const j = await r.json();
  if(!j.ok && /sesión venció|Inicia sesión/i.test(j.error||"")){ try{ localStorage.removeItem("iap_cred"); }catch{} return callApi(body); }
  return j;
}
const totpState = {};
function totpRest(box){
  const st=totpState[box.dataset.totp]||{};
  if(st.rest!==undefined) return st.rest;
  return box.dataset.rest===""||box.dataset.rest===undefined ? null : +box.dataset.rest;
}
async function fetchTotp(box, ask){
  const mail=box.dataset.totp, st=totpState[mail]=totpState[mail]||{};
  if(st.busy) return; st.busy=true; if(ask) st.err="";
  const btn=box.querySelector("[data-ask]"); if(ask){ btn.disabled=true; btn.textContent="Pidiendo…"; }
  try{
    const j=await callApi({action:"totp",v:2,ask:!!ask,correo:mail});
    if(!j.ok){ if(/SESION_2FA/.test(j.error||"")){ st.sesion=0; st.code=""; } else throw new Error(j.error||"Error"); }
    else { st.code=j.code; st.until=Date.now()+j.left*1000; st.rest=j.restantes; st.sesion=j.hasta||(Date.now()+600000); st.err=""; }
  }catch(err){ st.err=err.message; if(ask) st.sesion=0; }
  st.busy=false; renderTotp();
}
function askTotp(box){ return fetchTotp(box,true); }
function renderTotp(){
  const now=Date.now();
  for(const box of document.querySelectorAll("[data-totp]")){
    const st=totpState[box.dataset.totp]||{}, rest=totpRest(box);
    const active = st.code && st.sesion && st.sesion>now;
    if(active && st.until<=now && !st.busy) fetchTotp(box,false); // el código sigue circulando solo
    box.querySelector(".tview").hidden=!active;
    box.querySelector(".task").hidden=!!active;
    if(active){
      const left=Math.max(0,Math.ceil((st.until-now)/1000));
      box.querySelector(".tcode").textContent=st.code.slice(0,3)+" "+st.code.slice(3);
      box.querySelector(".tcopy").dataset.copy=st.code;
      box.querySelector(".tleft").textContent=left;
      box.querySelector(".tbar").style.width=(left/30*100)+"%";
      const m=Math.max(0,Math.ceil((st.sesion-now)/60000));
      box.querySelector(".tnote").textContent="El código se renueva solo durante "+m+" min más. Después tendrás que volver a pedirlo.";
    } else {
      const btn=box.querySelector("[data-ask]");
      const none = rest!==null && rest<=0;
      btn.disabled=none||!!st.busy;
      btn.textContent=none?"Sin códigos disponibles":"Pedir código de autenticación";
      box.querySelector(".trest").textContent = rest===null ? "" : (none ? "Ya usaste tus "+(box.dataset.max||3)+" pedidos." : "Te quedan "+rest+" de "+(box.dataset.max||3)+" pedidos.");
      box.querySelector(".tnote").textContent = st.err ? st.err : (none ? "Si necesitas ayuda, escríbenos por WhatsApp." : "Al pedirlo se descuenta 1 de tus "+(box.dataset.max||3)+" pedidos. Luego el código se renueva solo durante 10 minutos.");
    }
  }
}
function refreshTotp(){ renderTotp(); }
function copyText(t){
  const fb=()=>new Promise(r=>{ const a=document.createElement("textarea"); a.value=t; a.setAttribute("readonly",""); a.style.cssText="position:fixed;opacity:0;top:0"; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch{} a.remove(); r(); });
  return navigator.clipboard?.writeText ? navigator.clipboard.writeText(t).catch(fb) : fb();
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const fmt = d => d.toLocaleDateString("es-CO",{day:"2-digit",month:"long",year:"numeric"});
const I = {
  mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.5 7.6C3.9 9.4 2 12 2 12s3.6 6 10 6a9.8 9.8 0 0 0 4-.9"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>'
};
function message(title, text){
  $("#app").innerHTML = `<div class="msg"><h2>${title}</h2><p>${text}</p><a class="cta" href="index.html?tienda=1">Ir a la tienda</a></div>`;
}
function confetti(){
  const box=document.createElement("div"); box.className="confetti";
  const cols=["#1e6bff","#12a8ff","#12a36b","#fbbf24","#7c3aed"];
  for(let i=0;i<60;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=cols[i%5];
    p.style.animationDuration=(2.4+Math.random()*2.4)+"s";p.style.animationDelay=Math.random()+"s";box.appendChild(p);}
  document.body.appendChild(box); setTimeout(()=>box.remove(),6500);
}
const APPS=[{k:"capcut",n:"CapCut Pro",url:"https://www.capcut.com/login",host:"capcut.com"},{k:"filmora",n:"Filmora",url:"https://account.wondershare.com/",host:"Wondershare / Filmora"},{k:"chatgpt",n:"ChatGPT",url:"https://chatgpt.com/auth/login",host:"chatgpt.com"}];
const appOf=it=>APPS.find(a=>String(it.producto||"").toLowerCase().includes(a.k))||{k:"",n:it.producto||"tu cuenta",url:"",host:""};
function section(it){
  const app=appOf(it);
  const start = it.inicio ? new Date(it.inicio) : null;
  const end = it.fin ? new Date(it.fin) : null;
  const left = end ? Math.max(0, Math.ceil((end - Date.now())/DAY)) : 30;
  const pct = start && end ? Math.min(100, Math.max(0,(Date.now()-start)/(end-start)*100)) : 0;
  const ex = it.vencida;
  const left_col = ex ? `
    <div class="card"><h1>Tu plan venció</h1><p class="lead">El acceso a esta cuenta terminó. Escríbenos y la renovamos.</p>
    <a class="cta" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, quiero renovar mi '+it.producto)}">Renovar por WhatsApp</a></div>` : `
    <div class="card">
      <h1>Inicio de sesión directo</h1>
      <p class="lead">Usa los datos de la cuenta que aparecen abajo y sigue los pasos para iniciar sesión en ${esc(app.n)}.</p>
      ${it.cliente!==undefined?`<div class="note" style="margin:0 0 6px"><b>Admin:</b> código ${esc(it.codigo||'—')} · cliente ${esc(it.cliente||'sin asignar')}</div>`:''}
      <div class="lbl">${I.mail} Cuenta de acceso</div>
      <div class="field"><code>${esc(it.correo)}</code><button class="ib" data-copy="${esc(it.correo)}" title="Copiar">${I.copy}</button></div>
      <div class="lbl">${I.lock} Contraseña de acceso</div>
      <div class="field"><code class="pw" data-pw="${esc(it.clave)}">${esc(it.clave)}</code><button class="ib tog" title="Mostrar u ocultar">${I.eyeoff}</button><button class="ib" data-copy="${esc(it.clave)}" title="Copiar">${I.copy}</button></div>
      ${it.tiene2fa?`<div data-totp="${esc(String(it.correo).toLowerCase())}" data-rest="${it.restantes2fa??''}" data-max="${it.max2fa||3}"><div class="lbl">${I.lock} Código de dos pasos (autenticador)</div>
        <div class="tbox"><div class="tview" hidden><div class="trow"><span class="tcode">--- ---</span><span class="tcnt"><b class="tleft">30</b></span><button class="ib tcopy" data-copy="" title="Copiar código">${I.copy}</button></div><div class="tline"><i class="tbar"></i></div></div>
        <div class="task"><button class="cta tbtn" type="button" data-ask style="border:0;cursor:pointer;font:inherit;font-weight:700;margin:0">Pedir código de autenticación</button> <small class="trest" style="color:var(--mut);margin-left:8px"></small></div></div>
        <p class="tnote"></p></div>`:''}
      <div class="plan"><h3>⏳ ${left<=5&&end?'Tu plan está por vencer':'Tu plan está corriendo'}</h3>
        <div class="days">${left}<small>${left===1?'día restante':'días restantes'}</small></div>
        <div class="clock">Vence en <b data-end="${it.fin||''}">--</b></div>
        <div class="prog"><i style="width:${pct.toFixed(1)}%"></i></div>
        <div class="dates"><span>Inicio: ${start?fmt(start):'—'}</span><span>Vence: ${end?fmt(end):'—'}</span></div></div>
      ${left<=5&&end?`<a class="cta" style="display:flex;justify-content:center;margin-top:16px" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, quiero renovar mi '+it.producto+' ('+it.correo+')')}">🔄 Renovar mi plan</a>`:''}
      <a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}">💬 ¿Necesitas ayuda? Escríbenos por WhatsApp</a>
      <a class="wa" style="margin-top:10px;color:#b45f00;background:#fff8ec" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, tengo un problema con mi cuenta '+it.producto+' ('+it.correo+'). ¿Me ayudan o me dan otra cuenta?')}">⚠️ Tengo un problema con esta cuenta</a>
    </div>`;
  const right_col = ex ? '' : `
    <div class="steps"><h2>Cómo iniciar sesión</h2>
      <div class="step"><div class="num">1</div><div><h3>Abre ${esc(app.n)}</h3><p>${app.host?`Entra a ${esc(app.host)} e inicia sesión.`:`Abre la aplicación e inicia sesión.`}</p>${app.url?`<a class="cta" href="${app.url}" target="_blank" rel="noopener">Ir a ${esc(app.n)} →</a>`:""}</div></div>
      <div class="step"><div class="num">2</div><div><h3>Pega tu correo</h3><p>Copia la "Cuenta de acceso" con el botón de copiar, pégala en el campo de correo y pulsa "Continuar".</p>
        <div class="mock"><div class="t">Inicia sesión</div><div class="in hl"><span>${esc(it.correo)}</span><span>Editar</span></div><div class="go">Continuar</div></div></div></div>
      <div class="step"><div class="num">3</div><div><h3>Escribe la contraseña</h3><p>Copia la "Contraseña de acceso", pégala y pulsa "Continuar". Si te pide verificación, escríbenos por WhatsApp y te ayudamos.</p>
        <div class="mock"><div class="t">Introduce tu contraseña</div><div class="in hl"><span>Contraseña</span><span>👁</span></div><div class="go">Continuar</div></div></div></div>
      <div class="note"><b>Importante:</b> no cambies el correo ni la contraseña de la cuenta. Puedes usarla en hasta 2 dispositivos y tiene acceso por 1 mes.</div>
      ${app.k==="chatgpt"?`<details class="note" style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">¿Te sale el error "model not found" u otro error en ChatGPT?</summary>
        <ol style="margin:10px 0 0 18px;display:grid;gap:6px">
          <li>Abre una <b>ventana de incógnito</b> (Ctrl+Shift+N) e inicia sesión en chatgpt.com. Si ahí funciona, el problema es la memoria de tu navegador.</li>
          <li>En tu navegador normal borra las <b>cookies y la caché</b> de chatgpt.com y vuelve a entrar.</li>
          <li>Desactiva extensiones (bloqueadores de anuncios, VPN, extensiones de ChatGPT) o prueba con <b>Google Chrome</b> actualizado.</li>
          <li>Abre un <b>chat nuevo</b> y elige el modelo desde la lista de arriba (no uses chats ni enlaces antiguos).</li>
          <li>Si sigue igual, escríbenos por WhatsApp con una captura del error.</li>
        </ol></details>`:""}
    </div>`;
  return `<section class="acct ${ex?'expired':''}" data-prod="${esc(it.producto)}">${left_col}${right_col}</section>`;
}
function header(items){
  const it = items[0], ex = it.vencida;
  const end = it.fin ? new Date(it.fin) : null;
  const left = end ? Math.max(0, Math.ceil((end - Date.now())/DAY)) : 30;
  const u = load("iap_user"); const mail = u && u.email ? u.email.replace(/^(.{2}).*(@.*)$/,"$1****$2") : "";
  $("#bar").innerHTML = `<a class="brand" href="index.html?tienda=1"><img src="logo.webp" alt="IA Plus Colombia"></a>
    <div class="prod">${esc(it.producto)} <span class="badge ${ex?'off':''}">${ex?'Vencido':'Activo'}</span></div>
    <div class="meta">${mail?`<span>Cuenta <b>${esc(mail)}</b></span><span class="sep"></span>`:''}<span>Tiempo restante <b>${ex?'0 días':left+(left===1?' día':' días')}</b></span>${u&&String(u.email).toLowerCase()==="j03l1525@gmail.com"?'<a class="back" href="admin.html">Panel admin</a>':''}<a class="back" href="index.html?tienda=1">← Tienda</a></div>`;
}
function tick(){
  document.querySelectorAll("[data-end]").forEach(el=>{
    const e = el.dataset.end; if(!e) return;
    const ms = new Date(e) - Date.now(); if(ms<=0){ el.textContent="0 días"; return; }
    const d=Math.floor(ms/DAY), h=Math.floor(ms%DAY/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000);
    el.textContent = d+" d  "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  });
}
document.addEventListener("click", e=>{
  const c = e.target.closest("[data-copy]");
  if(c){ copyText(c.dataset.copy).then(()=>{ const t=c.innerHTML; c.classList.add("ok"); c.innerHTML=I.ok; setTimeout(()=>{c.classList.remove("ok");c.innerHTML=t;},1500); }); return; }
  const ask = e.target.closest("[data-ask]");
  if(ask){ askTotp(ask.closest("[data-totp]")); return; }
  const g = e.target.closest(".tog");
  if(g){ const pw=g.parentElement.querySelector(".pw"); const hid = pw.textContent.includes("•"); pw.textContent = hid ? pw.dataset.pw : "•".repeat(10); g.innerHTML = hid ? I.eyeoff : I.eye; }
});
function addBox(first){
  return `<div class="addbox" id="addbox"><h3>➕ ${first?'Desbloquea tu cuenta':'Agregar otra cuenta'}</h3>
    <p>${first?'Escribe el código que te enviamos por WhatsApp.':'¿Compraste otra cuenta? Escribe aquí su código de activación.'}</p>
    <form class="addrow" id="addForm"><input id="addCode" placeholder="Ej: IAP-AB12-CD34" autocomplete="off" maxlength="40"><button class="cta" style="margin:0" type="submit">Desbloquear</button></form>
    <div class="adderr" id="addErr" hidden></div>
    <p style="margin:12px 0 0"><a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, quiero comprar otra cuenta')}" target="_blank" rel="noopener" style="color:var(--acc);font-weight:700">¿No tienes código? Cómpralo por WhatsApp →</a></p></div>`;
}
function bindAdd(){
  const f=$("#addForm"); if(!f) return;
  f.onsubmit=async e=>{
    e.preventDefault(); const btn=f.querySelector("button"), err=$("#addErr"); err.hidden=true; btn.disabled=true; btn.textContent="Verificando…";
    try{
      const j=await callApi({action:"redeem",code:$("#addCode").value}); if(!j.ok) throw new Error(j.error||"Error");
      sessionStorage.removeItem("iap_conf"); await loadAll();
    }catch(ex){ err.textContent=ex.message; err.hidden=false; btn.disabled=false; btn.textContent="Desbloquear"; }
  };
}
let timer=null;
async function loadAll(){
  try{
    const j = await callApi({action:"list"}); if(!j.ok) throw new Error(j.error||"Error");
    save("iap_has", j.items.length>0);
    if(!j.items.length){ $("#app").innerHTML = addBox(true); bindAdd(); return; }
    header(j.items);
    $("#app").innerHTML = j.items.map(section).join("") + addBox(false);
    bindAdd();
    tick(); refreshTotp(); if(!timer) timer=setInterval(()=>{tick();refreshTotp();},1000);
    if(j.items.some(i=>!i.vencida) && !sessionStorage.getItem("iap_conf")){ sessionStorage.setItem("iap_conf","1"); confetti(); }
  }catch(err){ message("No pudimos cargar tu cuenta", esc(err.message)); }
}
loadAll();
(function(){
  const wa=document.getElementById("bnWa"); if(wa) wa.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Hola, necesito ayuda con mi cuenta");
  const add=document.getElementById("bnTop");
  if(add) add.addEventListener("click",e=>{ e.preventDefault(); const b=document.getElementById("addbox"); if(b){ b.scrollIntoView({behavior:"smooth",block:"center"}); setTimeout(()=>{ const i=document.getElementById("addCode"); if(i) i.focus(); },500); } });
  document.addEventListener("click",e=>{ const c=e.target.closest("[data-copy]"); if(!c) return; const t=document.createElement("div"); t.className="toastc"; t.textContent="Copiado ✔"; document.body.appendChild(t); setTimeout(()=>t.remove(),1400); });
})();
</script>

  <a href="#" id="bnTop" data-addcode><i>➕</i><span>Otro código</span></a>
  <a id="bnWa" target="_blank" rel="noopener"><i>💬</i><span>Ayuda</span></a>
  <button type="button" data-install><i>📲</i><span>Instalar</span></button>
</nav>
